services:
  mqttapi:
    image: diatar-mqttapi
    build:
      context: .
      dockerfile: src/MqttApi/Dockerfile
    ports:
      - "80:8080"
      # Az admin felület csak a host loopback-jén érhető el (pl. SSH alagúttal).
      - "127.0.0.1:${Admin_Port:-5262}:${Admin_Port:-5262}"
    environment:
      # A publikus API címe. ASPNETCORE_URLS is szabályozhatná, de akkor a Kestrel
      # "Overriding address(es)" figyelmeztetést ír minden induláskor.
      - Public__Url=http://+:8080
      - Mqtt__Host=${MQTT_HOST}
      - Mqtt__AdminUsername=${MQTT_ADMIN_USERNAME}
      - Mqtt__AdminPassword=${MQTT_ADMIN_PASSWORD}
      - Email__Host=${EMAIL_HOST}
      - Email__Port=${EMAIL_PORT}
      - Email__Username=${EMAIL_USERNAME}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__EnableSsl=${EMAIL_ENABLE_SSL}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS}
      - Email__FromName=${EMAIL_FROM_NAME}
      - Email__BaseUrl=${EMAIL_BASE_URL}
      - Admin__Usernames=${Admin_Usernames}
      - Admin__CookieSecret=${Admin_CookieSecret}
      - Admin__Port=${Admin_Port:-5262}
      # A Docker port publikálás a konténer eth0 címére DNAT-ol, nem a loopbackra, ezért
      # a konténerben minden interfészre figyelni kell. A védelmet a fenti 127.0.0.1-es
      # host mapping adja: kívülről csak SSH alagúttal (vagy localhoston) érhető el.
      - Admin__ListenAddress=0.0.0.0
    restart: unless-stopped
